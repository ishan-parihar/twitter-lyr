<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="hero-title hero-desc">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <title id="hero-title">twitter-lyr — Terminal-first Twitter/X CLI and MCP server</title>
  <desc id="hero-desc">Hero illustration showing twitter-lyr CLI with terminal demo and feature cards</desc>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#heroBg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.4"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>

  <!-- Title area -->
  <text id="hero-title" x="80" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="48" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5px">
    twitter-lyr
  </text>

  <!-- Badge row -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="120" height="28" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="60" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#58a6ff" text-anchor="middle">CLI Tool</text>

    <rect x="130" y="0" width="140" height="28" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="200" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#a371f7" text-anchor="middle">OAuth + Cookies</text>

    <rect x="280" y="0" width="110" height="28" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="335" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#3fb950" text-anchor="middle">AXI Compliant</text>

    <rect x="400" y="0" width="120" height="28" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="460" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#d2a8ff" text-anchor="middle">TOON Output</text>

    <rect x="530" y="0" width="100" height="28" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="580" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#ff7b72" text-anchor="middle">DM Ready</text>
  </g>

  <!-- Value proposition -->
  <text id="hero-desc" x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#c9d1d9" font-weight="400" line-height="1.5">
    Terminal-first Twitter/X client — read timelines, search, post, manage DMs, and automate with structured output built for AI agents.
  </text>

  <!-- Terminal demo -->
  <g transform="translate(80, 260)">
    <!-- Window chrome -->
    <rect x="0" y="0" width="500" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="500" height="32" rx="8" fill="#21262d">
      <animate attributeName="opacity" values="1;1;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- Traffic lights -->
    <circle cx="14" cy="16" r="6" fill="#ff5f57"/>
    <circle cx="36" cy="16" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="16" r="6" fill="#28ca42"/>

    <!-- Terminal content -->
    <text x="20" y="60" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#8b949e">$</text>
    <text x="36" y="60" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#f0f6fc">twitter feed -t following</text>

    <text x="20" y="84" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#58a6ff">✅ Fetched 20 tweets from following feed in 1.2s</text>

    <text x="20" y="106" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#8b949e">$</text>
    <text x="36" y="106" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#f0f6fc">twitter post "Hello from twitter-lyr!" --yaml</text>

    <text x="20" y="128" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#3fb950">ok: true</text>
    <text x="20" y="144" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">data:</text>
    <text x="40" y="144" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">id: "1234567890"</text>
    <text x="40" y="160" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">author: "@ishanparihar"</text>
    <text x="40" y="176" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">text: "Hello from twitter-lyr!"</text>
  </g>

  <!-- Right side: feature icons -->
  <g transform="translate(800, 80)">
    <!-- Read -->
    <g class="feature-card" transform="translate(0, 0)">
      <rect x="0" y="0" width="320" height="72" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1" opacity="0.8"/>
      <rect x="12" y="12" width="48" height="48" rx="8" fill="#21262d"/>
      <text x="36" y="44" font-size="28" text-anchor="middle" fill="#58a6ff">📖</text>
      <text x="72" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#f0f6fc">Read</text>
      <text x="72" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">feed, bookmarks, search, lists</text>
    </g>

    <!-- Write -->
    <g class="feature-card" transform="translate(0, 88)">
      <rect x="0" y="0" width="320" height="72" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1" opacity="0.8"/>
      <rect x="12" y="12" width="48" height="48" rx="8" fill="#21262d"/>
      <text x="36" y="44" font-size="28" text-anchor="middle" fill="#a371f7">✍️</text>
      <text x="72" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#f0f6fc">Write</text>
      <text x="72" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">post, quote, reply, like, retweet</text>
    </g>

    <!-- DM -->
    <g class="feature-card" transform="translate(0, 176)">
      <rect x="0" y="0" width="320" height="72" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1" opacity="0.8"/>
      <rect x="12" y="12" width="48" height="48" rx="8" fill="#21262d"/>
      <text x="36" y="44" font-size="28" text-anchor="middle" fill="#d2a8ff">💬</text>
      <text x="72" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#f0f6fc">DM</text>
      <text x="72" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">conversations, messages, typing</text>
    </g>

    <!-- Agent -->
    <g class="feature-card" transform="translate(0, 264)">
      <rect x="0" y="0" width="320" height="72" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5" opacity="0.9" filter="url(#glow)"/>
      <rect x="12" y="12" width="48" height="48" rx="8" fill="#21262d"/>
      <text x="36" y="44" font-size="28" text-anchor="middle" fill="#a371f7">🤖</text>
      <text x="72" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#a371f7">Agent Ready</text>
      <text x="72" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">TOON, YAML, JSON, session hooks</text>
    </g>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="200" height="36" rx="6" fill="url(#accentGrad)"/>
    <text x="100" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#0d1117" text-anchor="middle">uv tool install twitter-lyr</text>
  </g>

  <g transform="translate(300, 380)">
    <rect x="0" y="0" width="200" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="100" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#c9d1d9" text-anchor="middle">View on PyPI →</text>
  </g>
</svg>