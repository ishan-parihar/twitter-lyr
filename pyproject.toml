[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twitter-lyr"
version = "0.8.6"
description = "Twitter/X CLI using browser cookies and curl_cffi"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7.0",
    "browser-cookie3>=0.19",
    "inquirer>=3.4.0",
    "click>=8.0",
    "rich>=13.0",
    "PyYAML>=6.0",
    "xclienttransaction>=1.0.1",
    "beautifulsoup4>=4.12",
    "obscura-core @ git+https://github.com/ishan-parihar/obscura-core.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10,<2"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
# Third-party deps without stubs (yaml, requests, obscura_core, browser_cookie3,
# x_client_transaction): mypy >=1.20 reports them as import-untyped even with
# ignore_missing_imports; silencing the code keeps the gate green without
# vendoring stubs for untyped ecosystem packages.
disable_error_code = ["import-untyped"]

[project.scripts]
twitter-lyr = "twitter_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["twitter_cli*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Curated rule set (matches the tg-cli / obscura-core convention): the codebase
# is written against E/F/I/B/UP — not ruff's unbounded default. Explicit select
# keeps the CI gate deterministic instead of tracking whatever rules new ruff
# versions enable by default.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter; strings are kept readable
    "UP031",  # %-format strings are used deliberately (incl. logging formats);
              # ruff will not auto-fix these and they are correct as-is
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]